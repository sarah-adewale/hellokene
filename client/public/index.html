<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/kene-site-icon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="I design and ship digital products for people and businesses."
    />

    <!-- Link previews. Social sites don't run JavaScript, so these have to live
         here in the static HTML, with full URLs. Most platforms show the first
         frame of the GIF. -->
    <!-- Open Graph (Facebook, LinkedIn, Slack, etc.) -->
    <meta property="og:title" content="Kene's Portfolio" />
    <meta property="og:description" content="I design and ship digital products for people and businesses." />
    <meta property="og:image" content="https://www.hellokene.com/images/summary_large_image.gif" />
    <meta property="og:image:type" content="image/gif" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hello, I'm Kene. I design and ship digital products for people and businesses." />
    <meta property="og:url" content="https://www.hellokene.com/" />
    <meta property="og:type" content="website" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kene's Portfolio" />
    <meta name="twitter:description" content="I design and ship digital products for people and businesses." />
    <meta name="twitter:image" content="https://www.hellokene.com/images/summary_large_image.gif" />
    <meta name="twitter:image:alt" content="Hello, I'm Kene. I design and ship digital products for people and businesses." />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/kene-site-icon-180.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->

    <title>Kene's Portfolio</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
